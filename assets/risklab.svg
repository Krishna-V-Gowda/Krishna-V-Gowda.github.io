<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc">
  <title id="title">RiskLab</title>
  <desc id="desc">Robust allocation under uncertainty, shown as regime bands, covariance geometry, and drawdown paths.</desc>
