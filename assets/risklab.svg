  <text x="96" y="155" fill="#d9e7eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="70" font-weight="700" letter-spacing="5">RISKLAB</text>
  <text x="100" y="212" fill="#8ca8b3" font-family="system-ui, sans-serif" font-size="25">ROBUST ALLOCATION UNDER ESTIMATION ERROR, REGIME SHIFT &amp; COST</text>
