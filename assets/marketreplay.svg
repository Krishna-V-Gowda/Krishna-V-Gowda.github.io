<title id="title">MarketReplay</title><desc id="desc">Deterministic market-data replay and order-state reconstruction.</desc><rect width="1280" height="640" fill="#071820"/><g stroke="#12313c" stroke-width="1"><path d="M0 0v640"/><path d="M64 0v640"/><path d="M128 0v640"/><path d="M192 0v640"/><path d="M256 0v640"/><path d="M320 0v640"/><path d="M384 0v640"/><path d="M448 0v640"/><path d="M512 0v640"/><path d="M576 0v640"/><path d="M640 0v640"/><path d="M704 0v640"/><path d="M768 0v640"/><path d="M832 0v640"/><path d="M896 0v640"/><path d="M960 0v640"/><path d="M1024 0v640"/><path d="M1088 0v640"/><path d="M1152 0v640"/><path d="M1216 0v640"/><path d="M1280 0v640"/><path d="M0 0h1280"/><path d="M0 64h1280"/><path d="M0 128h1280"/><path d="M0 192h1280"/><path d="M0 256h1280"/><path d="M0 320h1280"/><path d="M0 384h1280"/><path d="M0 448h1280"/><path d="M0 512h1280"/><path d="M0 576h1280"/><path d="M0 640h1280"/></g><g font-family="ui-monospace,SFMono-Regular,Consolas,monospace"><text x="76" y="118" fill="#f4f8f8" font-size="58" font-weight="700">MARKETREPLAY</text><text x="78" y="158" fill="#9ab7bf" font-size="20">Deterministic ITCH replay · order-state reconstruction · differential evidence</text><g transform="translate(78 242)"><rect width="1124" height="246" rx="20" fill="#0d2530" stroke="#2b6978" stroke-width="2"/><text x="36" y="54" fill="#4bd7c8" font-size="16">TAPE</text><text x="36" y="94" fill="#eaf4f5" font-size="26">A  E  X  U  F  C  D  S</text><path d="M275 84h120" stroke="#4bd7c8" stroke-width="3"/><text x="420" y="72" fill="#f0b45d" font-size="16">ATOMIC TRANSITION</text><text x="420" y="106" fill="#eaf4f5" font-size="22">order index ⇄ price levels</text><path d="M760 84h92" stroke="#f0b45d" stroke-width="3"/><text x="880" y="72" fill="#4bd7c8" font-size="16">PROOF</text><text x="880" y="106" fill="#eaf4f5" font-size="22">C++ = Python</text><text x="36" y="188" fill="#9ab7bf" font-size="17">Malformed frames fail closed. Aggregates rebuild. Canonical state is deterministic.</text></g><text x="78" y="566" fill="#9ab7bf" font-size="17">C++20 · zero runtime dependencies · reproducible fixtures · explicit limitations</text></g></svg>
